<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حساب أعمار لجين وليان</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 25px;
      font-size: 24px;
    }

    .person-box {
      background: #f8f9fa;
      border-right: 5px solid #3498db;
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 20px;
      text-align: right;
    }

    .person-box.layan {
      border-right-color: #e84393;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 5px;
    }

    .birthdate {
      font-size: 14px;
      color: #7f8c8d;
      margin-bottom: 10px;
    }

    .age-result {
      font-size: 16px;
      color: #2e7d32;
      font-weight: 600;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>الأعمار الحالية تلقائياً</h1>

    <!-- لجين -->
    <div class="person-box">
      <div class="name">لجين</div>
      <div class="birthdate">تاريخ الميلاد: 25 مارس 2010</div>
      <div class="age-result" id="logeen-age">جاري الحساب...</div>
    </div>

    <!-- ليان -->
    <div class="person-box layan">
      <div class="name">ليان</div>
      <div class="birthdate">تاريخ الميلاد: 18 يونيو 2014</div>
      <div class="age-result" id="layan-age">جاري الحساب...</div>
    </div>
  </div>

  <script>
    function calculateExactAge(birthDateString) {
      const today = new Date();
      const birthDate = new Date(birthDateString);

      let years = today.getFullYear() - birthDate.getFullYear();
      let months = today.getMonth() - birthDate.getMonth();
      let days = today.getDate() - birthDate.getDate();

      if (days < 0) {
        months--;
        // الحصول على عدد أيام الشهر السابق
        const prevMonthLastDay = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        days += prevMonthLastDay;
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      return `${years} سنة، و ${months} شهر، و ${days} يوم`;
    }

    // تحديث العمر في الصفحة
    document.getElementById('logeen-age').innerText = calculateExactAge('2010-03-25');
    document.getElementById('layan-age').innerText = calculateExactAge('2014-06-18');
  </script>

</body>
</html>
